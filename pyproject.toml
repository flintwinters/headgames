[project]
name = "headgames"
version = "0.1.0"
description = "Verification tooling for a minimal analog EEG sonification MVP"
requires-python = ">=3.11"
dependencies = [
    "numba>=0.63",
    "numpy>=2.2",
    "rich>=13.7",
    "scipy>=1.15",
    "typer>=0.12",
]

[tool.uv]
package = false


[tool.pylint.main]
recursive = true

[tool.pylint.messages_control]
disable = "all"
enable = ["too-many-lines"]

[tool.pylint.design]
max-module-lines = 600

[dependency-groups]
dev = [
    "pylint>=4.0.7",
]
